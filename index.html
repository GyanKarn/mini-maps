<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Maps App</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body, html { height: 100%; }
    
    #map { 
        height: 100%; 
        width: 100%; 
    }
    
    .search-box {
        position: absolute;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        background: white;
        padding: 8px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        display: flex;
        gap: 8px;
    }
    
    .search-box input {
        border: none;
        outline: none;
        padding: 8px 12px;
        width: 250px;
        font-size: 14px;
    }
    
    .search-box button {
        background: #007acc;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
    }
    
    .locate-btn {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 1000;
        background: #007acc;
        color: white;
        border: none;
        padding: 12px 16px;
        border-radius: 50%;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
</style>
</head>
<body>

<div class="search-box">
    <input type="text" id="searchInput" placeholder="Search place... e.g. Bhilai, India">
    <button onclick="searchPlace()">Search</button>
</div>

<button class="locate-btn" onclick="getLocation()">📍</button>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// 1. Initialize Map - Default to Bhilai, Chhattisgarh
let map = L.map('map').setView([21.1938, 81.3509], 12);

// 2. Add OpenStreetMap tiles
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
}).addTo(map);

// 3. Add marker
let marker = L.marker([21.1938, 81.3509]).addTo(map)
    .bindPopup("<b>Bhilai</b><br>Your current location area").openPopup();

// 4. Search Place using Nominatim API
async function searchPlace() {
    let query = document.getElementById("searchInput").value;
    if(!query) return alert("Enter a place name");
    
    let url = `https://nominatim.openstreetmap.org/search?format=json&q=${query}`;
    let res = await fetch(url);
    let data = await res.json();
    
    if(data.length > 0) {
        let lat = data[0].lat;
        let lon = data[0].lon;
        map.setView([lat, lon], 14);
        marker.setLatLng([lat, lon])
              .bindPopup(`<b>${data[0].display_name}</b>`).openPopup();
    } else {
        alert("Place not found");
    }
}

// 5. Get User Current Location
function getLocation() {
    if(navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((pos) => {
            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;
            map.setView([lat, lon], 15);
            marker.setLatLng([lat, lon])
                  .bindPopup("<b>You are here</b>").openPopup();
        }, () => {
            alert("Location access denied");
        });
    }
}

// 6. Click on map to add marker
map.on('click', function(e){
    marker.setLatLng(e.latlng)
          .bindPopup(`Lat: ${e.latlng.lat.toFixed(4)}<br>Lng: ${e.latlng.lng.toFixed(4)}`).openPopup();
});
</script>
</body>
</html>
